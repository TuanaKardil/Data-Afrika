[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afrienrich"
version = "0.1.0"
description = "CLI tool to enrich African importer company data with contact information"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "phonenumbers>=8.13",
    "email-validator>=2.1",
    "dnspython>=2.6",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
]

[project.scripts]
afrienrich = "afrienrich.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/afrienrich"]

[tool.hatch.build.targets.sdist]
include = ["src/afrienrich", "config", "tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
    "pandas-stubs>=2.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/afrienrich/ai/prompts.py" = ["E501"]  # prompt strings must stay readable
"src/afrienrich/main.py" = ["E402"]  # load_dotenv() must run before local imports

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
